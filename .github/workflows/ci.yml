name: LA Sales Academy CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Typecheck, Test & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (Frontend + Backend)
        run: npm run typecheck

      - name: Run API & RAG Integration Tests (Vitest)
        run: npm test

      - name: Build Production SPA & Hono Server Bundle
        run: npm run build

